        <div class="dash-tab-panel active" id="tab-overview">

                <label class="checkbox-label"><input type="checkbox" id="showSellers" checked onchange="renderActivityFeed()"> 🧑‍💼 New Sellers</label>

        </div>

        <div class="dash-tab-panel" id="tab-sellers">
            <div class="seller-subtabs">
                <button class="seller-subtab-btn active" id="sellersSubtab-pending" onclick="switchSellersSubtab('pending')">⏳ Pending</button>

    <div class="item-modal-overlay" id="itemModalOverlay" onclick="if(event.target===this) closeItemModal()">
        <div class="item-modal" id="itemModalContent"></div>
    </div>

  <script>
if (localStorage.getItem('kayaOwner') !== 'true') {
        document.body.innerHTML = '<div style="padding:40px; text-align:center;"><h2>Access Denied</h2><p>Owner login required.</p></div>';
    } else {
        loadDashboard();
    }

   function ownerLogout() {
        if (!confirm("Log out of owner mode?")) return;
        localStorage.setItem('kayaOwner', 'false');
        window.location.href = 'index.html';
    }

  function switchDashTab(tab) {
        document.querySelectorAll('.dash-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.dash-tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tabBtn-' + tab).classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    function switchItemsSubtab(sub) {
        document.querySelectorAll('.items-subtab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.items-subpanel').forEach(p => p.classList.remove('active'));
        document.getElementById('itemsSubtab-' + sub).classList.add('active');
        document.getElementById('itemsPanel-' + sub).classList.add('active');
    }

    let allItemsData = [];

    function loadAllItems() {
        db.collection('items').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            allItemsData = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                d.firestoreId = doc.id;
                allItemsData.push(d);
            });
            renderPendingItems();
            renderAllItems();
        });
    }

    function itemThumb(item) {
        return (item.images && item.images[0]) || item.image || 'https://via.placeholder.com/52x52?text=No+Image';
    }

   function renderPendingItems() {
        const list = document.getElementById('pendingItemsList');
        const badge = document.getElementById('pendingItemCount');
        const pending = allItemsData.filter(i => i.status === 'pending');

        badge.style.display = pending.length > 0 ? 'inline-block' : 'none';
        badge.innerText = pending.length;

        if (pending.length === 0) {
            list.innerHTML = '<p style="color:#999; font-size:13px;">No items awaiting review.</p>';
            return;
        }

        list.innerHTML = pending.map(item => `
            <div class="item-review-row" style="cursor:pointer;" onclick="openItemModal('${item.firestoreId}')">
                <img class="item-review-thumb" src="${itemThumb(item)}">
                <div class="item-review-info">
                    <div class="item-review-title">${item.title}</div>
                    <div class="item-review-meta">GHS ${item.price} · ${item.sellerName || 'Unknown seller'} · ${item.sellerLocation || ''}</div>
                </div>
                <div class="item-review-actions" onclick="event.stopPropagation()">
                    <button class="item-btn-approve" onclick="setItemStatus('${item.firestoreId}', 'approved')">Approve</button>
                    <button class="item-btn-decline" onclick="setItemStatus('${item.firestoreId}', 'declined')">Decline</button>
                </div>
            </div>
        `).join('');
    }

    function openItemModal(id) {
        const item = allItemsData.find(i => i.firestoreId === id);
        if (!item) return;

        const images = (item.images && item.images.length) ? item.images : (item.image ? [item.image] : []);
        const imagesHtml = images.length
            ? `<div class="item-modal-images">${images.map(src => `<img src="${src}">`).join('')}</div>`
            : '';

        document.getElementById('itemModalContent').innerHTML = `
            <button class="item-modal-close" onclick="closeItemModal()">✕</button>
            ${imagesHtml}
            <h2>${item.title}</h2>
            <div class="item-modal-price">GHS ${item.price}</div>
            <div class="item-modal-desc">${item.description || 'No description provided.'}</div>
            <div class="item-modal-seller">
                🧑‍💼 ${item.sellerName || 'Unknown seller'}<br>
                📍 ${item.sellerLocation || 'Unknown location'}
            </div>
            <div class="item-modal-actions">
                <button class="item-btn-approve" onclick="setItemStatus('${item.firestoreId}', 'approved'); closeItemModal();">Approve</button>
                <button class="item-btn-decline" onclick="setItemStatus('${item.firestoreId}', 'declined'); closeItemModal();">Decline</button>
            </div>
        `;
        document.getElementById('itemModalOverlay').classList.add('active');
    }

    function closeItemModal() {
        document.getElementById('itemModalOverlay').classList.remove('active');
    }

    function openSaleModal(saleId) {
        const sale = allSalesData.find(s => s.firestoreId === saleId);
        if (!sale) return;
        const dateStr = sale.time ? new Date(sale.time).toLocaleString() : 'Unknown';

        document.getElementById('itemModalContent').innerHTML = `
            <button class="item-modal-close" onclick="closeItemModal()">✕</button>
            <h2>${sale.title}</h2>
            <div class="item-modal-price">GHS ${sale.price} · commission GHS ${sale.commission.toFixed(2)}</div>
            <div class="item-modal-desc">
                🧑‍💼 Seller: ${sale.sellerName || 'Unknown'}<br>
                🛍️ Buyer: ${sale.buyerName || 'Unknown'}<br>
                📅 Sold: ${dateStr}
            </div>
            <div class="item-modal-seller">
                <div style="font-weight:700; margin-bottom:8px;">💬 Conversation</div>
                <div id="saleChatMessages">Loading...</div>
            </div>
        `;
        document.getElementById('itemModalOverlay').classList.add('active');

        db.collection('chats')
            .where('itemTitle', '==', sale.title)
            .where('buyerName', '==', sale.buyerName)
            .limit(1)
            .get()
            .then(snap => {
                const box = document.getElementById('saleChatMessages');
                if (!box) return;
                if (snap.empty) {
                    box.innerHTML = '<p style="color:#999; font-size:12.5px;">No conversation found.</p>';
                    return;
                }
                const chat = snap.docs[0].data();
                const messages = chat.messages || [];
                if (messages.length === 0) {
                    box.innerHTML = '<p style="color:#999; font-size:12.5px;">No messages in this conversation.</p>';
                    return;
                }
                box.innerHTML = messages.map(m => `
                    <div style="margin-bottom:8px; font-size:12.5px;">
                        <span style="font-weight:700;">${m.sender || 'Unknown'}:</span> ${m.text || ''}
                    </div>
                `).join('');
            })
            .catch(err => {
                const box = document.getElementById('saleChatMessages');
                if (box) box.innerHTML = `<p style="color:#e74c3c; font-size:12.5px;">Failed to load: ${err.message}</p>`;
            });
    }

    function renderAllItems() {
        const list = document.getElementById('allItemsList');

        if (allItemsData.length === 0) {
            list.innerHTML = '<p style="color:#999; font-size:13px;">No items posted yet.</p>';
            return;
        }

        list.innerHTML = allItemsData.map(item => `
            <div class="item-review-row">
                <img class="item-review-thumb" src="${itemThumb(item)}">
                <div class="item-review-info">
                    <div class="item-review-title">${item.title}</div>
                    <div class="item-review-meta">GHS ${item.price} · ${item.sellerName || 'Unknown seller'}</div>
                    <span class="item-status-tag ${item.status === 'approved' ? 'approved' : 'pending'}">${item.status || 'pending'}</span>
                </div>
                <div class="item-review-actions">
                    <button class="item-btn-edit" onclick="editItemFromDashboard('${item.firestoreId}')">Edit</button>
                    <button class="item-btn-delete" onclick="deleteItemFromDashboard('${item.firestoreId}')">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function setItemStatus(id, status) {
        if (!confirm(`Mark this item as ${status}?`)) return;
        db.collection('items').doc(id).update({ status }).catch(err => alert('Failed: ' + err.message));
    }

    function editItemFromDashboard(id) {
        const item = allItemsData.find(i => i.firestoreId === id);
        if (!item) return;
        const newTitle = prompt("Item name:", item.title);
        if (newTitle === null) return;
        const newPrice = prompt("Price (GHS):", item.price);
        if (newPrice === null) return;
        const newDescription = prompt("Description:", item.description || "");
        db.collection('items').doc(id).update({
            title: newTitle,
            price: newPrice,
            description: newDescription
        }).catch(err => alert('Failed: ' + err.message));
    }

    function deleteItemFromDashboard(id) {
        const item = allItemsData.find(i => i.firestoreId === id);
        if (!item) return;
        if (confirm(`Delete "${item.title}"? This can't be undone.`)) {
            db.collection('items').doc(id).delete().catch(err => alert('Failed: ' + err.message));
        }
    }
    // Global raw data caches so filtering doesn't need a re-fetch
    let allSalesData = [];
    let allSellersData = [];
    let allChatsData = [];
    let activeItemCount = 0;
    let activeSellerCount = 0;
    let totalUserCount = 0;

  function switchSellersSubtab(sub) {
        document.querySelectorAll('.seller-subtab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.seller-subpanel').forEach(p => p.classList.remove('active'));
        document.getElementById('sellersSubtab-' + sub).classList.add('active');
        document.getElementById('sellersPanel-' + sub).classList.add('active');
    }

let allSellersFullList = [];
    let allBuyersData = [];

    function loadAllBuyers() {
        db.collection('buyers').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            allBuyersData = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                d.firestoreId = doc.id;
                allBuyersData.push(d);
            });
            renderAllBuyers();
        });
    }

    function renderAllBuyers() {
        const list = document.getElementById('allBuyersList');
        if (allBuyersData.length === 0) {
            list.innerHTML = '<p style="color:#999; font-size:13px;">No registered buyers yet.</p>';
            return;
        }
        list.innerHTML = allBuyersData.map(b => `
            <div class="seller-req-item" style="cursor:pointer;" onclick="openBuyerModal('${b.firestoreId}')">
                <div class="seller-req-name">${b.name || 'Unknown buyer'}</div>
                <div class="seller-req-meta">📍 ${b.location || 'Unknown'} · 📞 ${b.phone || ''}</div>
            </div>
        `).join('');
    }

    function openBuyerModal(id) {
        const b = allBuyersData.find(x => x.firestoreId === id);
        if (!b) return;
        const joined = b.createdAt ? b.createdAt.toDate().toLocaleDateString() : 'Unknown';

        document.getElementById('itemModalContent').innerHTML = `
            <button class="item-modal-close" onclick="closeItemModal()">✕</button>
            <h2>${b.name || 'Unknown buyer'}</h2>
            <div class="item-modal-desc">
                📍 ${b.location || 'Unknown'}<br>
                📞 ${b.phone || ''}${b.email ? ' · ✉️ ' + b.email : ''}<br>
                Joined: ${joined}
            </div>
        `;
        document.getElementById('itemModalOverlay').classList.add('active');
    }
    function loadAllSellers() {
        db.collection('sellers').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            allSellersFullList = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                d.firestoreId = doc.id;
                allSellersFullList.push(d);
            });
            renderAllSellers();
        });
    }

function getSellerStats(sellerName) {
        const itemsPosted = allItemsData.filter(i => i.sellerName === sellerName).length;
        const sellerSales = allSalesData.filter(s => s.sellerName === sellerName);
        const salesCount = sellerSales.length;
        const totalCommission = sellerSales.reduce((sum, s) => sum + s.commission, 0);
        const totalRevenue = sellerSales.reduce((sum, s) => sum + s.price, 0);
        const sellerEarnings = totalRevenue - totalCommission;
        return { itemsPosted, salesCount, totalCommission, totalRevenue, sellerEarnings };
    }

    function renderAllSellers() {        const list = document.getElementById('allSellersList');
        if (allSellersFullList.length === 0) {
            list.innerHTML = '<p style="color:#999; font-size:13px;">No sellers yet.</p>';
            return;
        }
       list.innerHTML = allSellersFullList.map(s => {
            const stats = getSellerStats(s.name);
            return `
            <div class="seller-req-item" style="cursor:pointer;" onclick="openSellerModal('${s.firestoreId}')">
                <div class="seller-req-name">${s.businessName || s.name}</div>
                <div class="seller-req-meta">👤 ${s.name} · 📍 ${s.location || 'Unknown'}</div>
                <div class="seller-req-meta">📦 ${stats.itemsPosted} items · 💰 ${stats.salesCount} sales · GHS ${stats.sellerEarnings.toFixed(2)} earned</div>
                <span class="seller-status-tag ${s.status || 'pending'}">${s.status || 'pending'}</span>
            </div>
        `;
        }).join('');
    }

  function openSellerModal(id) {
        const s = allSellersFullList.find(x => x.firestoreId === id);
        if (!s) return;
        const joined = s.createdAt ? s.createdAt.toDate().toLocaleDateString() : 'Unknown';
        const stats = getSellerStats(s.name);
        const status = s.status || 'pending';

        let actionsHtml;
        if (status === 'pending') {
            actionsHtml = `
                <button class="item-btn-approve" onclick="setSellerStatus('${s.firestoreId}', 'approved'); closeItemModal();">Approve</button>
                <button class="item-btn-decline" onclick="setSellerStatus('${s.firestoreId}', 'declined'); closeItemModal();">Decline</button>
            `;
        } else {
            actionsHtml = `
                <button class="item-btn-warn" onclick="setSellerStatus('${s.firestoreId}', 'warned'); closeItemModal();">Warn</button>
                <button class="item-btn-suspend" onclick="setSellerStatus('${s.firestoreId}', 'suspended'); closeItemModal();">Suspend</button>
                <button class="item-btn-ban" onclick="setSellerStatus('${s.firestoreId}', 'banned'); closeItemModal();">Ban</button>
                <button class="item-btn-delete" onclick="removeSellerFromDashboard('${s.firestoreId}')">Remove</button>
            `;
        }

        document.getElementById('itemModalContent').innerHTML = `
            <button class="item-modal-close" onclick="closeItemModal()">✕</button>
            <h2>${s.businessName || s.name}</h2>
            <div class="item-modal-desc">
                👤 ${s.name}<br>
                📍 ${s.location || 'Unknown'}<br>
                📞 ${s.phone || ''}${s.email ? ' · ✉️ ' + s.email : ''}<br>
                🪪 ${s.ghanaCard || 'No Ghana Card provided'}<br>
                Requested: ${joined}
            </div>
            <span class="seller-status-tag ${status}">${status}</span>
            <div class="stat-grid" style="margin-top:14px;">
                <div class="stat-box"><div class="num">${stats.itemsPosted}</div><div class="label">Items Posted</div></div>
                <div class="stat-box"><div class="num">${stats.salesCount}</div><div class="label">Items Sold</div></div>
                <div class="stat-box"><div class="num">GHS ${stats.sellerEarnings.toFixed(0)}</div><div class="label">Seller Earned</div></div>
            </div>
            <div class="item-modal-desc" style="margin-top:10px;">
                💵 Total sales value: GHS ${stats.totalRevenue.toFixed(2)}<br>
                🏦 Commission paid to KayaMart: GHS ${stats.totalCommission.toFixed(2)}
            </div>
            <div class="item-modal-actions" style="margin-top:16px; flex-wrap:wrap;">
                ${actionsHtml}
            </div>
        `;
        document.getElementById('itemModalOverlay').classList.add('active');
    }

    function removeSellerFromDashboard(id) {
        const s = allSellersFullList.find(x => x.firestoreId === id);
        if (!s) return;
        if (confirm(`Permanently remove seller "${s.businessName || s.name}"? This can't be undone.`)) {
            db.collection('sellers').doc(id).delete().catch(err => alert('Failed: ' + err.message));
            closeItemModal();
        }
    }

  function loadDashboard() {
        loadPendingSellers();
        loadAllSellers();
        loadAllBuyers();
        loadAllItems();

        db.collection('items').get().then(snap => {
            activeItemCount = snap.size;
            renderStats();
        });

     db.collection('sellers').where('status', '==', 'approved').get().then(snap => {
            activeSellerCount = snap.size;
            renderStats();
        });

      db.collection('buyers').get().then(snap => {
            totalUserCount = snap.size;
            renderStats();
        });

   db.collection('sales').orderBy('soldAt', 'desc').get().then(snap => {
            allSalesData = snap.docs.map(doc => {
                const d = doc.data();
                return {
                    icon: '💰',
                    firestoreId: doc.id,
                    text: `Sale: ${d.title} - GHS ${d.price} (commission GHS ${d.commission?.toFixed(2)})`,
                    time: d.soldAt ? d.soldAt.toMillis() : 0,
                    commission: d.commission || 0,
                    title: d.title || '',
                    price: d.price || 0,
                    sellerName: d.sellerName || '',
                    buyerName: d.buyerName || '',
                    clickable: true
                };
            });
            renderStats();
            renderActivityFeed();
            renderAllSellers();
        });

        db.collection('sellers').orderBy('createdAt', 'desc').get().then(snap => {
            allSellersData = snap.docs.map(doc => {
                const d = doc.data();
                return {
                    icon: '🧑‍💼',
                    text: `New seller registered: ${d.name} (${d.location || 'Unknown'})`,
                    time: d.createdAt ? d.createdAt.toMillis() : 0
                };
            });
            renderActivityFeed();
        });

      db.collection('chats').orderBy('lastMessageAt', 'desc').get().then(snap => {
            allChatsData = snap.docs.map(doc => {
                const d = doc.data();
                return {
                    icon: '💬',
                    text: `New message about: ${d.itemTitle} from ${d.buyerName}`,
                    time: d.lastMessageAt ? d.lastMessageAt.toMillis() : 0
                };
            });
            renderActivityFeed();
        });
    }

    function loadPendingSellers() {
        db.collection('sellers').where('status', '==', 'pending').onSnapshot(snapshot => {
            const list = document.getElementById('pendingSellersList');
            const badge = document.getElementById('pendingSellerCount');
            const count = snapshot.size;

            badge.style.display = count > 0 ? 'inline-block' : 'none';
            badge.innerText = count;

            if (snapshot.empty) {
                list.innerHTML = '<p style="color:#999; font-size:13px;">No pending requests right now.</p>';
                return;
            }

            let sellers = [];
            snapshot.forEach(doc => sellers.push({ id: doc.id, ...doc.data() }));
            sellers.sort((a, b) => {
                const at = a.createdAt ? a.createdAt.toMillis() : 0;
                const bt = b.createdAt ? b.createdAt.toMillis() : 0;
                return bt - at;
            });

           list.innerHTML = sellers.map(s => {
                const joined = s.createdAt ? s.createdAt.toDate().toLocaleDateString() : 'Unknown';
                return `
                    <div class="seller-req-item" style="cursor:pointer;" onclick="openSellerModal('${s.id}')">
                        <div class="seller-req-name">${s.businessName || s.name}</div>
                        <div class="seller-req-meta">👤 ${s.name} · 📍 ${s.location || 'Unknown'}</div>
                        <div class="seller-req-meta">📞 ${s.phone || ''}${s.email ? ' · ✉️ ' + s.email : ''}</div>
                        <div class="seller-req-meta">🪪 ${s.ghanaCard || 'No Ghana Card provided'}</div>
                        <div class="seller-req-meta">Requested: ${joined}</div>
                        <div class="seller-req-actions" onclick="event.stopPropagation()">
                            <button class="seller-req-approve" onclick="setSellerStatus('${s.id}', 'approved')">✔ Approve</button>
                            <button class="seller-req-decline" onclick="setSellerStatus('${s.id}', 'declined')">✕ Decline</button>
                        </div>
                    </div>
                `;
            }).join('');
        });
    }

    function setSellerStatus(id, status) {
        if (!confirm(`Mark this seller as ${status}?`)) return;
        db.collection('sellers').doc(id).update({ status }).catch(err => {
            alert('Failed to update seller: ' + err.message);
        });
    }

    function getDateBounds() {

        const fromVal = document.getElementById('dateFrom').value;
        const toVal = document.getElementById('dateTo').value;
        const from = fromVal ? new Date(fromVal + 'T00:00:00').getTime() : null;
        const to = toVal ? new Date(toVal + 'T23:59:59').getTime() : null;
        return { from, to };
    }

    function inRange(time, from, to) {
        if (from !== null && time < from) return false;
        if (to !== null && time > to) return false;
        return true;
    }

    function renderStats() {
        const { from, to } = getDateBounds();
        const filteredSales = allSalesData.filter(s => inRange(s.time, from, to));
        const totalCommission = filteredSales.reduce((sum, s) => sum + s.commission, 0);
document.getElementById('statGrid').innerHTML = `
            <div class="stat-box"><div class="num">${activeItemCount}</div><div class="label">Active Items</div></div>
            <div class="stat-box"><div class="num">${activeSellerCount}</div><div class="label">Active Sellers</div></div>
            <div class="stat-box"><div class="num">${totalUserCount}</div><div class="label">Total Users</div></div>
            <div class="stat-box"><div class="num">${filteredSales.length}</div><div class="label">Total Sales${(from || to) ? ' (filtered)' : ''}</div></div>
            <div class="stat-box"><div class="num">GHS ${totalCommission.toFixed(0)}</div><div class="label">Total Commission${(from || to) ? ' (filtered)' : ''}</div></div>
        `;    }

    function renderActivityFeed() {
        const feed = document.getElementById('activityFeed');
        const { from, to } = getDateBounds();

      const showSales = document.getElementById('showSales').checked;
        const showSellers = document.getElementById('showSellers').checked;
        const showChats = document.getElementById('showChats').checked;

        let allActivities = [];
        if (showSales) allActivities = allActivities.concat(allSalesData);
        if (showSellers) allActivities = allActivities.concat(allSellersData);
        if (showChats) allActivities = allActivities.concat(allChatsData);

        allActivities = allActivities.filter(act => inRange(act.time, from, to));

        allActivities.sort((a, b) => b.time - a.time);

        if (allActivities.length === 0) {
            feed.innerHTML = '<p style="color:#999;">No activity in this range.</p>';
            return;
        }

       feed.innerHTML = '';
        allActivities.slice(0, 15).forEach(act => {
            const dateStr = act.time ? new Date(act.time).toLocaleString() : '';
            const clickAttr = act.clickable ? `style="cursor:pointer;" onclick="openSaleModal('${act.firestoreId}')"` : '';
            feed.innerHTML += `
                <div class="activity-item" ${clickAttr}>
                    <div class="activity-icon">${act.icon}</div>
                    <div>
                        <div class="activity-text">${act.text}</div>
                        <div class="activity-time">${dateStr}</div>
                    </div>
                </div>
            `;
        });
    }

    function applyDateFilter() {
        renderStats();
        renderActivityFeed();
    }

    function clearDateFilter() {
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        renderStats();
        renderActivityFeed();
    }
function exportSalesCSV() {
        const { from, to } = getDateBounds();
        const filteredSales = allSalesData.filter(s => inRange(s.time, from, to));

        if (filteredSales.length === 0) {
            alert('No sales in the selected range to export.');
            return;
        }

        let csv = 'Date,Title,Price (GHS),Commission (GHS)\n';
        filteredSales.forEach(s => {
            const dateStr = s.time ? new Date(s.time).toLocaleDateString() : '';
            const safeTitle = `"${(s.title || '').replace(/"/g, '""')}"`;
            csv += `${dateStr},${safeTitle},${s.price},${s.commission.toFixed(2)}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const fromLabel = from ? new Date(from).toISOString().slice(0,10) : 'all';
        const toLabel = to ? new Date(to).toISOString().slice(0,10) : 'all';
        link.download = `kayamart-sales_${fromLabel}_to_${toLabel}.csv`;
        link.click();
        URL.revokeObjectURL(url);
    }
</script>
